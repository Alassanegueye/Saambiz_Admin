# ============================================================
#  SaamBiz — administration : configuration Nginx (VPS Ubuntu)
#
#  Remplacer : YOUR_DOMAIN par le vrai domaine (ex: admin.saambiz.com)
#  Déposer dans : /etc/nginx/sites-available/saambiz-admin
#  Activer via  : ln -sf /etc/nginx/sites-available/saambiz-admin \
#                        /etc/nginx/sites-enabled/saambiz-admin
#
#  À POSER APRÈS CERTBOT. Les chemins /etc/letsencrypt/live/… ci-dessous
#  n'existent qu'une fois le certificat émis : utiliser deploy/nginx-http.conf
#  pour le premier passage, puis ce fichier.
#
#  L'administration ne fait tourner aucun processus : `npm run build` produit
#  dist/, et Nginx le sert tel quel. Pas de conteneur, pas de port, rien à
#  redémarrer après un déploiement.
# ============================================================

# ── Redirection HTTP → HTTPS ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Serveur HTTPS ─────────────────────────────────────────────────────────────
server {
    # `listen … http2` et non `http2 on;` : cette seconde forme, pourtant la
    # seule recommandée aujourd'hui, n'existe qu'à partir de Nginx 1.25.1 —
    # Ubuntu 22.04 et 24.04 livrent 1.24, où elle fait échouer `nginx -t` sur
    # « unknown directive "http2" ». L'ancienne forme fonctionne sur les deux
    # versions ; sur 1.25+ elle produit un simple avertissement.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    # ── Certificats Let's Encrypt (générés par Certbot) ──────────────────────
    #
    # L'include apporte le jeu TLS recommandé par Mozilla — ssl_protocols,
    # ssl_ciphers, ssl_prefer_server_ciphers, réglages de session — tenu à
    # jour par Certbot. Ne pas redéclarer ces directives ici : Nginx refuse
    # les doublons et `nginx -t` échouerait.
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── En-têtes de sécurité ─────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    # Une console d'administration n'a rien à faire dans les moteurs de recherche.
    add_header X-Robots-Tag              "noindex, nofollow"                            always;

    root  /var/www/saambiz-admin/dist;
    index index.html;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        image/svg+xml;

    # ── Routes de l'application ──────────────────────────────────────────────
    # /login, /vendeurs, /commandes n'existent pas sur le disque : React Router
    # les résout côté client. Sans try_files, ouvrir un lien direct ou
    # recharger la page renvoie un 404 Nginx — c'est le premier symptôme à
    # vérifier quand « le site marche mais pas quand je rafraîchis ».
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache ────────────────────────────────────────────────────────────────
    # Les fichiers de dist/assets portent une empreinte dans leur nom : un
    # contenu modifié change de nom, on peut donc les garder un an.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html est le seul point d'entrée à revalider. Sans cette exception,
    # un administrateur garderait indéfiniment les anciens noms de fichiers
    # après un déploiement, donc une page blanche jusqu'à vidage du cache.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── Logs ─────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/saambiz-admin-access.log combined;
    error_log  /var/log/nginx/saambiz-admin-error.log warn;
}
