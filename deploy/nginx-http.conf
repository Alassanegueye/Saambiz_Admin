# ============================================================
#  SaamBiz — administration : configuration Nginx PROVISOIRE
#
#  À poser AVANT Certbot, le temps d'obtenir le certificat.
#  Remplacer : YOUR_DOMAIN par le vrai domaine (ex: admin.saambiz.com)
#
#    cp deploy/nginx-http.conf /etc/nginx/sites-available/saambiz-admin
#    sed -i "s/YOUR_DOMAIN/admin.saambiz.com/g" /etc/nginx/sites-available/saambiz-admin
#    ln -sf /etc/nginx/sites-available/saambiz-admin /etc/nginx/sites-enabled/
#    nginx -t && systemctl reload nginx
#    certbot --nginx -d admin.saambiz.com
#
#  Puis seulement, remplacer par deploy/nginx.conf (TLS durci, cache, HSTS).
#
#  Pourquoi deux fichiers : deploy/nginx.conf référence
#  /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem, qui n'existe pas tant que
#  Certbot n'est pas passé. Le poser trop tôt fait échouer `nginx -t` — et
#  comme un seul fichier invalide empêche de recharger TOUS les sites de la
#  machine, cela bloque aussi les autres domaines servis par ce serveur.
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Validation ACME de Certbot (émission et renouvellement).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root  /var/www/saambiz-admin/dist;
    index index.html;

    # Application à page unique : /login, /vendeurs, /commandes n'existent pas
    # sur le disque, React Router les résout côté client. Sans try_files,
    # ouvrir un lien direct ou recharger la page renvoie un 404 Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
